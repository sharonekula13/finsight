<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinSight</title>
<style>
  :root { --bg:#0f1216; --card:#171b21; --line:#262c35; --fg:#e8eaed; --muted:#9aa4b2; --accent:#5b8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; margin:0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 24px; }
  .row { display:flex; gap:8px; }
  input, select, button { font: inherit; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:10px 12px; }
  input { flex:1; }
  button { background: var(--accent); border-color: var(--accent); color:#fff; cursor:pointer; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
  .answer { white-space:pre-wrap; }
  .meta { display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-top:12px; }
  .pill { background:#0d2440; color:#9cc0ff; border-radius:999px; padding:2px 10px; font-size:12px; }
  code { color:#9cc0ff; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>FinSight</h1>
    <div class="sub">Multi-agent RAG over SEC filings — ask a question about the sample corpus.</div>
    <div class="row">
      <input id="q" placeholder="e.g. What was NovaTech's total revenue in fiscal 2024?" />
      <select id="model"></select>
      <button id="ask">Ask</button>
    </div>
    <div id="out"></div>
  </div>
<script>
const API = location.origin;
async function init() {
  try {
    const h = await (await fetch(`${API}/health`)).json();
    const sel = document.getElementById("model");
    (h.models || ["mock-a","mock-b"]).forEach(m => {
      const o = document.createElement("option"); o.value=o.textContent=m; sel.appendChild(o);
    });
  } catch (e) { /* server not running */ }
}
async function ask() {
  const question = document.getElementById("q").value.trim();
  if (!question) return;
  const model = document.getElementById("model").value || "mock-a";
  const out = document.getElementById("out");
  out.innerHTML = '<div class="card">Thinking…</div>';
  try {
    const r = await (await fetch(`${API}/ask`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ question, model })
    })).json();
    out.innerHTML = `
      <div class="card">
        <div class="answer">${escapeHtml(r.answer)}</div>
        <div class="meta">
          <span class="pill">${r.route.kind}</span>
          <span>grounded: ${r.grounded_ratio}</span>
          <span>citations: ${r.citations.join(", ")}</span>
          <span>latency: ${r.latency_s}s</span>
        </div>
      </div>`;
  } catch (e) {
    out.innerHTML = `<div class="card">Error: ${escapeHtml(String(e))}. Is the API running?</div>`;
  }
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
document.getElementById("ask").addEventListener("click", ask);
document.getElementById("q").addEventListener("keydown", e => { if (e.key==="Enter") ask(); });
init();
</script>
</body>
</html>
